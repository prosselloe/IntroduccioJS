Fes un formulari amb 2 “input” per introduir els coeficients d’una equació de primer grau. 
En clicar un botó s’ha de mostrar per pantalla el seu resultat.
-->
<html>
    <head>
        <title>Resultat equació 1r grau</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>  
        function equacio() {
            var coeficient, independent, resultat;
            coeficient = document.getElementById("coeficient").value;
            independent = document.getElementById("independent").value;
            resultat = -independent / coeficient;
            alert("El resultat és X = " + resultat);
        }
        </script>        
    </head>
    <body>
        <form action="/action_page.php">
          <label for="coeficient">Coeficient de la X: </label>
          <input type="number" id="coeficient" name="coeficient"><br>
          <label for="independent">Terme independent: </label>
          <input type="number" id="independent" name="independent"><br>
          <input type="button" onclick="equacio()" value="Resultat">
        </form>
    </body>
</html>
