Fes un formulari amb un “input” que digui si un nombre està en l’interval (-1, 1). 
PISTA: A JS Introduction teniu un exemple similar.
-->
<html>
    <head>
        <title>Nombre en l'interval</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>  
        function interval() {
            const fitaInf = -1, fitaSup = 1;
            var numero;
            numero = document.getElementById("nombre").value;
            if ((numero < fitaInf) && (numero > fitaSup)) {
              alert("El nombre està en l'interval");
            } else {
              alert("El nombre NO està en l'interval");            
            }
        }
        </script>        
    </head>
    <body>
        <form action="/action_page.php">
          <label for="nombre">Introduiex el nombre: </label>
          <input type="number" id="nombre" name="nombre">
          <input type="button" onclick="interval()" value="Comprovar">
        </form>
    </body>
</html>
